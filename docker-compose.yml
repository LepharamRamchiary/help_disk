services:
  client:
    build:
      context: ./client
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api-gateway

  api-gateway:
    build:
      context: ./server/api-gateway
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      AUTH_SERVICE_URL: http://auth:8001
    depends_on:
      auth:
        condition: service_healthy

  auth:
    build:
      context: ./server/auth
    ports:
      - "8001:8001"
    env_file:
      - ./server/auth/.env
    environment:
      PORT: 8001
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8001/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
