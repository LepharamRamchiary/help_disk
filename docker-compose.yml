services:
  client:
    build:
      context: ./client
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api-gateway

  api-gateway:
    build:
      context: ./server/api-gateway
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      AUTH_SERVICE_URL: http://auth:8001
    depends_on:
      - auth

  auth:
    build:
      context: ./server/auth
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
