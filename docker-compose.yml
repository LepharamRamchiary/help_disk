
services:
  # =====================================
  # CLIENT - NEXT.JS
  # =====================================
  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}

    depends_on:
      api-gateway:
        condition: service_healthy

    restart: unless-stopped

  # =====================================
  # API GATEWAY
  # =====================================
  api-gateway:
    build:
      context: ./server/api-gateway

    ports:
      - "8000:8000"

    environment:
      NODE_ENV: production
      PORT: 8000

      AUTH_SERVICE_URL: http://auth:8001
      SUPPORT_SERVICE_URL: http://support:8002

      CORS_ALLOWED_ORIGINS: http://localhost:3000

    depends_on:
      auth:
        condition: service_healthy
      support:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped

  # =====================================
  # AUTH SERVICE - MYSQL
  # =====================================
  auth:
    build:
      context: ./server/auth

    ports:
      - "8001:8001"

    env_file:
      - ./server/auth/.env

    environment:
      NODE_ENV: production
      PORT: 8001
      DB_HOST: host.docker.internal
      DATABASE_URL: "mysql://root:${MYSQL_PASSWORD}@host.docker.internal:3306/help_dask_auth"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    restart: unless-stopped

  # =====================================
  # SUPPORT SERVICE - MONGODB
  # =====================================
  support:
    build:
      context: ./server/support

    ports:
      - "8002:8002"

    env_file:
      - ./server/support/.env

    environment:
      NODE_ENV: production
      PORT: 8002
      MONGODB_URI: mongodb://mongo:27017/support_db

    depends_on:
      mongo:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8002/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    restart: unless-stopped

  # =====================================
  # MONGODB DATABASE
  # =====================================
  mongo:
    image: mongo:8

    ports:
      - "27017:27017"

    volumes:
      - support_mongo_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    restart: unless-stopped

# =====================================
# PERSISTENT VOLUMES
# =====================================
volumes:
  support_mongo_data:
